<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rwanda Yield-Gap Explorer</title>
  <meta name="description" content="Where are Rwanda's crop yields furthest behind the best districts, what is closing the gap worth, and which farm practices are linked to higher yields? Built on NISR Seasonal Agricultural Survey 2025 data by The Pillars.">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="canonical" href="https://pazzo123.github.io/yieldgap-rwanda/">
  <!-- Link previews (WhatsApp, X, LinkedIn, Facebook) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Rwanda Yield-Gap Explorer">
  <meta property="og:title" content="Rwanda Yield-Gap Explorer">
  <meta property="og:description" content="Where Rwanda's harvests fall behind, what closing the gap is worth, and what helps. NISR SAS 2025 data, 30 districts, 16 crops.">
  <meta property="og:url" content="https://pazzo123.github.io/yieldgap-rwanda/">
  <meta property="og:image" content="https://pazzo123.github.io/yieldgap-rwanda/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Map of Rwanda's districts shaded by crop yield gap, with the title Rwanda Yield-Gap Explorer">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#2a78d6">
  <!-- Poppins is served from this site (fonts/), with the device's sans-serif as the fallback -->
  <link rel="preload" href="fonts/poppins-latin-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply a saved light/dark choice before first paint, so the page never flashes the wrong theme.
    try { var saved = localStorage.getItem("yieldgap-theme"); if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved; } catch (e) {}
  </script>
</head>
<body>
  <noscript>
    <p style="margin:16px;padding:16px;border:1px solid #c3c2b7;border-radius:12px;font-family:sans-serif">
      This explorer needs JavaScript. Please turn it on, or read the project report:
      <a href="https://github.com/PAZZO123/yieldgap-rwanda/blob/main/docs/project-report.md">docs/project-report.md</a>.
    </p>
  </noscript>

  <header class="topbar no-print">
    <div class="topline">
      <a class="brand" href="./" aria-label="Rwanda Yield-Gap Explorer">
        <img class="logo" src="logo.svg" alt="" width="36" height="36">
        <span class="brand-text"><b>Yield-Gap</b> Explorer<small>Rwanda</small></span>
      </a>
      <div class="prefs">
        <div class="segmented" role="radiogroup" id="lang"></div>
        <div class="segmented" role="radiogroup" id="theme"></div>
        <button class="icon-btn" type="button" id="help"></button>
      </div>
    </div>
    <div class="strip">
      <div class="segmented" role="radiogroup" id="season"></div>
      <span class="vr" aria-hidden="true"></span>
      <nav class="crops" id="crops"></nav>
    </div>
  </header>

  <div class="highlight no-print" id="highlight"></div>

  <main class="stage">
    <section class="map-card" id="map-card">
      <div class="topleft">
        <div class="kpis" id="kpis"></div>
        <label class="search">
          <span data-icon="search" aria-hidden="true"></span>
          <input id="map-search" type="search" list="district-list" autocomplete="off">
          <datalist id="district-list"></datalist>
        </label>
      </div>
      <div class="map-wrap" id="map-wrap">
        <svg id="map" role="group"></svg>
      </div>
      <div class="map-controls no-print" id="map-controls"></div>
      <div class="legend" id="legend"></div>
      <div class="hint no-print" id="hint" hidden></div>
      <div class="layers no-print" id="layers" role="radiogroup"></div>
    </section>

    <aside class="panel" id="panel">
      <header class="panel-head" id="panel-head"></header>
      <nav class="tabs no-print" id="tabs" role="tablist"></nav>
      <div class="panes" id="panes"></div>
    </aside>
  </main>

  <footer class="foot" id="notes"></footer>
  <p class="print-only fine" id="printed-from"></p>

  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="sheet-card">
      <div class="sheet-head">
        <h2 id="sheet-title"></h2>
        <div class="sheet-actions">
          <button class="ghost icon-text" type="button" id="sheet-csv"></button>
          <button class="icon-btn" type="button" id="sheet-close"></button>
        </div>
      </div>
      <div class="sheet-body" id="sheet-body"></div>
    </div>
  </div>

  <div class="tooltip" id="tooltip" role="status" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <div class="tour" id="tour" hidden></div>

  <script src="icons.js"></script>
  <script src="i18n.js"></script>
  <script src="data/app_data.js"></script>
  <script src="data/districts.js"></script>
  <script src="app.js"></script>
</body>
</html>
